user nginx;
worker_processes 1;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    resolver 127.0.0.11;

    gzip on;
    gzip_static on;
    gzip_comp_level 2;
    gzip_min_length 64;

    types {
        application/manifest+json webmanifest;
    }
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    keepalive_timeout 65;

    server_tokens off;
    client_max_body_size 64k;

    # Behind cloudflared every request arrives from the Docker network; use the visitor's address instead, so the
    # limits below apply per visitor. The port is only published on localhost, so the header can't be forged.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;

    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_req_status 429;
    limit_conn_status 429;

    upstream server {
        server server:8081;
    }

    server {
        listen 8080 default_server;
        listen [::]:8080 default_server;
        server_name _;

        root "/usr/share/nginx/html";

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        location /api {
            limit_req zone=api burst=40 nodelay;
            limit_conn perip 30;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Host $http_host;
            proxy_pass http://server;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
        }

        location /assets {
            expires 365d;
        }

        location ~ ^/games/(.*)/?$ {
            try_files "" /index.html;
        }

        location = /cast {
            try_files "" /cast.html;
        }

        location = / {
            try_files "" /index.html;
        }

        error_page 404 /;
    }
}
