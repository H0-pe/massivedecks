# Massive Decks im Homelab (CT100). Server und Client werden aus diesem Fork gebaut.
# Aufruf aus /opt/massivedecks (dort liegt die .env mit MD_SECRET, der Fork ist nach ./src geklont):
#   docker compose -p massivedecks -f src/deployment/homelab/compose.yaml --env-file .env up -d --build
# Spieldaten liegen im RAM des Servers: Neustart des Containers beendet laufende Lobbys.

name: massivedecks

networks:
  internal:

services:
  server:
    # Aus diesem Fork gebaut: enthält die Hausregel „God Is Dead“ (Abstimmen statt Kartenzar).
    build:
      context: ../../server
      args:
        VERSION: homelab
    image: "massivedecks-server:homelab"
    container_name: massivedecks-server
    environment:
      - NODE_ENV=production
      - MD_SECRET=${MD_SECRET}
    volumes:
      - ./config.json5:/md/config.json5:ro
    networks:
      - internal
    restart: unless-stopped

  client:
    build:
      context: ../../client
      args:
        VERSION: homelab
    image: "massivedecks-client:homelab"
    container_name: massivedecks-client
    depends_on:
      - server
    ports:
      - "3010:8080/tcp"
    networks:
      - internal
    restart: unless-stopped
